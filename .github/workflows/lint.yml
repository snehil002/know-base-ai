name: Backend Code Quality (ESLint)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**' # Only run when files inside the backend folder change
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**' # Only run when files inside the backend folder change

jobs:
  lint:
    runs-on: ubuntu-latest

    # This tells GitHub to run all commands inside the backend folder by default
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # Points the cache to the backend package-lock.json
          cache-dependency-path: ./backend/package-lock.json 

      - name: Install backend dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .